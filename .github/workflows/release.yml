name: Publish Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (example: v0.1.0-test)"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -euo pipefail
          test -f CHANGELOG.md
          test -f latest.json
          test -f latest.yml
          python - <<'PY'
          import json
          with open("latest.json", "r", encoding="utf-8") as f:
              json.load(f)
          print("latest.json is valid JSON")
          PY

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp CHANGELOG.md latest.json latest.yml LICENSE.md release-assets/
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ -f "RELEASE_NOTES_${GITHUB_REF_NAME}.md" ]; then
            cp "RELEASE_NOTES_${GITHUB_REF_NAME}.md" release-assets/
          fi

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          generate_release_notes: true
          files: |
            release-assets/*
